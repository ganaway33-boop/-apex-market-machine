name: APEX Headless Tests

on:
  push:
    branches:
      - main
      - feature/apex-ui
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install
      - name: Test Twelve Data API
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          curl -sS "https://api.twelvedata.com/quote?symbol=NVDA&apikey=${TWELVE_DATA_API_KEY}" \
            | node -e "
              let d='';
              process.stdin.on('data',c=>d+=c);
              process.stdin.on('end',()=>{
                const r=JSON.parse(d);
                if (r.code || r.status === 'error') {
                  console.error('Twelve Data API failed:', r.message || r);
                  process.exit(1);
                }
                console.log('Twelve Data API OK:', r.symbol, r.close);
              });
            "
      - name: Start static server
        run: npx http-server -p 8080 &

      - name: Wait for server
        run: |
          for i in $(seq 1 20); do
            if curl -sSf http://localhost:8080/tests.html >/dev/null; then
              echo "server up"
              exit 0
            fi
            sleep 1
          done
          echo "server failed to start" >&2
          exit 1

      - name: Run headless tests
        env:
          TEST_OUTPUT_DIR: test-artifacts
        run: |
          mkdir -p test-artifacts
          node run-tests.js http://localhost:8080/tests.html

      - name: Upload artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apex-test-artifacts
          path: test-artifacts

      - name: Fail job if tests failed
        if: failure()
        run: |
          echo "APEX tests failed"
          exit 1